---
- name: Java Pre-Check on Database server
  hosts: ebisddb01.abcbs.net
  gather_facts: no
  tasks:
    - name: Find all path where Java is Installed
      shell: |
      find / -type d \(-name "java" -o -name "jdk" -o -name "jre*"\)
      register: java_paths
      ignore_errors: yes
    - name: Ensure Java path are uniqe
      set_fact:
        unique_java_paths: "{{ java_paths_stdout_lines|unique }}"
    - name: Display found Java paths
      debug:
        msg: "Found Java binary at {{ itnameem }}"
      with_items: "{{ unique_java_path}}"
    - name: Check Java Version for each path 
      shell: |
        {{ item }} -version 2 > $1
      with_items: "{{ unique_java_path}}"
      register: java_versions
      ignore_errors: yes
    - name: Display Java version result
      debug: 
        msg: | 
          Path: {{ item.item }}
          Output: |
            {{ item.stdout }}
      with_items: "{{ java_versions.results}}" 
        
      
