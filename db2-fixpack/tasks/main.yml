---  
- name: Ensure tmp dir in ansible_db2 home
  ansible.builtin.file:
    path: "/home/ansible_db2/.ansible/tmp"
    state: directory
    mode: '0775'
    
- name: Extract IBM DB2 package
  ansible.builtin.command:
    cmd: "tar -xvzf {{ db2_bin_temp }}/special_43682_v11.5.9_linuxx64_universal_fixpack.tar.gz -C {{db2_binary_location}}"

- name: Get running DB2 databses instance
  shell: ps -ef|grep -w db2sysc|grep -v grep|awk '{print $1}'|sort|uniq
  register: running_instances

- name: Get fence ID for each instance
  shell:
    cmd: ". ~/.profile;db2pd -fmp 2>/dev/null |grep -w User |awk '{print $3}'|sort|uniq"
  register: fence_ids
  with_items: "{{ running_instances.stdout_lines }}"
  become: yes
  loop_control:
    index_var: instance_index
  become_user: "{{ item.split(' ')[0] }}"

    
- name: Debug fence_ids raw output
  debug:
    var: fence_ids.results
  
- name: Extract fence_ids
  debug:
    msg: "Fenced user for Instance {{ item.item }}: {{ item.stdout | default('No output') }}"
  with_items: "{{ fence_ids.results }}"
  loop_control:
    loop_var: item

- name: debug and extract fence id
  debug:
    msg: "Fenced user for Instance {{ item.item }}: {{ fence_ids.results[db2_index].stdout | default('No output') }}"
  with_items: "{{ fence_ids.results }}"
  loop_control:
    loop_var: item
    index_var: db2_index

- name: Run db2support and rename the file
  shell:
    cmd: ". ~/.profile;db2support {{ temp_dir }} -s; mv {{ temp_dir }}/db2support.zip {{ temp_dir }}/db2support_{{item}}.zip"
  with_items: "{{ running_instances.stdout_lines }}"
  become: yes
  loop_control:
    index_var: instance_index
  become_user: "{{ item.split(' ')[0] }}"
    
- name: Stop each db2 database
  shell:
    cmd: ". ~/.profile;db2stop force"
  with_items: "{{ running_instances.stdout.split() }}"
  become: yes
  loop_control:
    index_var: instance_index
  become_user: "{{ item.split(' ')[0] }}"

  
  
- name: create  directory for new installation
  ansible.builtin.file:
    path:  "{{ new_db2_path }}"
    state: directory
    mode: '0775'
    
- name: mount exec tmp set
  shell: |
    mount -o remount,exec /tmp
  become: yes

- name: Run the install special build fix pack
  shell: |
    ./installFixPack -b {{ base_db2_path }} -n -y -p {{ new_db2_path }}
  args:
    chdir: "{{db2_binary_location}}/universal"

    
- name: Run db2iupdt for each instance
  shell: |
    ./db2iupdt -u {{ fence_id }} {{ instance }}
  args:
    chdir: "{{  new_db2_path }}/instance" 
  loop: "{{ running_instances.stdout_lines }}"
  loop_control:
    loop_var: instance
    index_var: db2_index
  vars:
    fence_id: " {{ fence_ids.results[db2_index].stdout |trim }}"

- name: mount exec tmp set
  shell: |
    mount -o remount,noexec /tmp
  become: yes
  
- name: Start each db2 database
  shell:
    cmd: ". ~/.profile;db2start" 
  with_items: "{{ running_instances.stdout.split() }}"
  become: yes
  loop_control:
    index_var: instance_index
  become_user: "{{ item.split(' ')[0] }}"
  


